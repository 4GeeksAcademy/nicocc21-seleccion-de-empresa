# docker-compose.yml — Entorno de desarrollo Brasaland
# Ejecutar: docker compose up --build
services:

  # ─── PostgreSQL (Inventario Hito 5) ────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: brasaland-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brasaland}
      POSTGRES_USER: ${POSTGRES_USER:-brasaland}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brasaland_dev}
    # SEC-001: PostgreSQL solo accesible desde la red interna de Docker,
    # no desde el host. El backend se conecta vía red interna.
    expose:
      - "5432"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brasaland} -d ${POSTGRES_DB:-brasaland}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - brasaland-net

  # ─── Backend Python (FastAPI + WSGI) ───────────────────
  backend:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: brasaland-backend
    ports:
      # SEC-002: Backend solo accesible desde localhost.
      # En producción, un proxy inverso (Nginx/Caddy) en el host
      # redirige HTTPS → 8000/8001 internos.
      - "127.0.0.1:8000:8000"   # WSGI (incidencias analyze/export)
      - "127.0.0.1:8001:8001"   # FastAPI (auth, suppliers, incidents CRUD, inventory)
    env_file: .env
    volumes:
      - ./services/brasaland_api/:/app/services/brasaland_api/
      - ./packages/:/app/packages/
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - brasaland-net

  # ─── Frontend: Web pública ─────────────────────────────
  website:
    build:
      context: ./uis/website
      dockerfile: Dockerfile
    container_name: brasaland-website
    # SEC-003: Frontend público solo desde localhost.
    # En producción se sirve estáticamente vía Nginx en puerto 443.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./uis/website/:/app/
      - /app/node_modules/
    networks:
      - brasaland-net

  # ─── Frontend: Backoffice (panel admin) ────────────────
  backoffice:
    build:
      context: ./uis/backoffice
      dockerfile: Dockerfile
    container_name: brasaland-backoffice
    # SEC-003: Backoffice solo desde localhost.
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./:/app/
      - /app/uis/backoffice/node_modules/
    working_dir: /app/uis/backoffice
    env_file: .env
    depends_on:
      - backend
    networks:
      - brasaland-net

  # ─── Qdrant (Base de Datos Vectorial — Hito 7 RAG) ────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: brasaland-qdrant
    # SEC-004: Qdrant solo accesible desde la red interna de Docker.
    # El backend se conecta vía red interna. Dashboard administrativo
    # no expuesto a internet.
    expose:
      - "6333"
      - "6334"
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - brasaland-net

volumes:
  pgdata:
  qdrant_data:

networks:
  brasaland-net:
    driver: bridge