# docker-compose.yml — Entorno de desarrollo Brasaland
# Ejecutar: docker compose up --build
services:

  # ─── PostgreSQL (Inventario Hito 5) ────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: brasaland-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-brasaland}
      POSTGRES_USER: ${POSTGRES_USER:-brasaland}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brasaland_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brasaland} -d ${POSTGRES_DB:-brasaland}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - brasaland-net

  # ─── Redis (broker y backend de resultados de Celery, DEV-55) ───
  redis:
    image: redis:7-alpine
    container_name: brasaland-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - brasaland-net

  # ─── Backend Python (FastAPI + WSGI) ───────────────────
  backend:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: brasaland-backend
    ports:
      - "8000:8000"   # WSGI (incidencias analyze/export)
      - "8001:8001"   # FastAPI (auth, suppliers, incidents CRUD, inventory)
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./services/:/app/services/
      - ./data/:/app/data/
      - ./packages/:/app/packages/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - brasaland-net

  # ─── Worker Celery (proceso independiente de FastAPI) ──
  worker:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: brasaland-worker
    command: ["celery", "-A", "services.celery_app", "worker", "--loglevel=INFO"]
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./services/:/app/services/
      - ./data/:/app/data/
      - ./packages/:/app/packages/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - brasaland-net

  # ─── Flower (monitor de la cola, solo desarrollo) ──────
  flower:
    build:
      context: .
      dockerfile: services/Dockerfile
    container_name: brasaland-flower
    command: ["celery", "-A", "services.celery_app", "flower", "--port=5555"]
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5555:5555"
    volumes:
      - ./services/:/app/services/
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - brasaland-net

  # ─── Frontend: Web pública ─────────────────────────────
  website:
    build:
      context: ./uis/website
      dockerfile: Dockerfile
    container_name: brasaland-website
    ports:
      - "3000:3000"
    volumes:
      - ./uis/website/:/app/
      - /app/node_modules/
    networks:
      - brasaland-net

  # ─── Frontend: Backoffice (panel admin) ────────────────
  backoffice:
    build:
      context: ./uis/backoffice
      dockerfile: Dockerfile
    container_name: brasaland-backoffice
    ports:
      - "3001:3001"
    volumes:
      - ./:/app/
      - /app/uis/backoffice/node_modules/
    working_dir: /app/uis/backoffice
    env_file: .env
    depends_on:
      - backend
    networks:
      - brasaland-net

volumes:
  pgdata:
  redisdata:

networks:
  brasaland-net:
    driver: bridge